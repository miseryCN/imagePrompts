name: Import verified Hangzhou atlas
on:
  push:
    branches: [site/hangzhou-fire-atlas-20260907]
    paths: [.github/workflows/import-hangzhou-atlas.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconstruct, verify and commit original website
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, sys, tempfile, urllib.request, zlib
          from pathlib import Path
          repo = os.environ['REPO']
          assert repo == 'miseryCN/imagePrompts'
          branch = 'site/hangzhou-fire-atlas-20260907'
          prefix = 'hangzhou-fire-atlas/'
          blobs = [
              '9f6e0934efb364e0d750473dca38d1cdd409569d',
              '9a951b46362ea8a5c10b90be7ede4d13a988861f',
              'c3a1de702c23ffed76b61e7bacb2bdcb441d83f0',
              'a55f9129b515e8fe9762ebeb83feccd36ab031e3',
              'b5d9678534451aaf029281c9636c983c3ced32d6',
              'be09c2db3ca322280cc27eaca2ebf2d141190ec3',
              'b447cb083fbb18474f06d7e1e80e02d4593f3f64',
          ]
          def api(path, data=None, method=None):
              assert path.startswith('/') and '..' not in path
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data, ensure_ascii=False).encode('utf-8'),
                  method=method or ('GET' if data is None else 'POST'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Hangzhou-atlas-verified-import',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          records = {}
          for sha in blobs:
              result = api('/git/blobs/' + sha)
              text = base64.b64decode(result['content']).decode('utf-8')
              for line in text.splitlines():
                  index, crc, encoded = line.split(':', 2)
                  index = int(index)
                  assert index not in records, 'Duplicate source record'
                  raw = base64.b64decode(encoded, validate=True)
                  assert zlib.crc32(raw) == int(crc, 16), 'Invalid source record: ' + str(index)
                  records[index] = raw
          assert sorted(records) == list(range(217))
          packed = b''.join(records[i] for i in range(217))
          assert len(packed) == 41524
          assert hashlib.sha256(packed).hexdigest() == 'd5461aec1a99dea42813434b218b6c47022b3016173c4ff50f830244b6e43ae0'
          sources = json.loads(lzma.decompress(packed))
          expected = {'index.template.html', 'app.js', 'style.css', 'research/build_data.py', 'research/build_art.py', 'research/build_site.py'}
          assert set(sources) == expected
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / 'site'
              for name, content in sources.items():
                  path = root / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8')
              (root / 'assets').mkdir(exist_ok=True)
              (root / 'data').mkdir(exist_ok=True)
              for script in ['build_data.py', 'build_art.py', 'build_site.py']:
                  subprocess.run([sys.executable, str(root / 'research' / script)], check=True)
              subprocess.run(['node', '--check', str(root / 'app.js')], check=True)
              html = (root / 'index.html').read_bytes()
              digest = hashlib.sha256(html).hexdigest()
              assert len(html) == 303219
              assert digest == 'd2ed89233b902d345deb47d6bd995d0202db483ade8c6fcc4b735bd7c53925cf', digest
              print('Verified original HTML SHA256:', digest)
              (root / 'README.md').write_text(
                  '# 炙 · 杭州｜全城炭火图鉴\n\n'
                  '独立静态页面： https://miserycn.github.io/imagePrompts/hangzhou-fire-atlas/\n\n'
                  '此目录不修改仓库原有提示词网站。包含原始设计、111 条门店/摊位记录及逐店来源。'
                  '并非全城无遗漏名单；历史价格、地址和营业情况以页面提示与商家最新信息为准。'
                  '个人实吃分档、收藏和笔记保存在访问者自己的浏览器，不会公开同步。\n\n'
                  '重新构建：依次运行 research/build_data.py、research/build_art.py、research/build_site.py。'
                  '只需要 Python 标准库。直接打开 index.html 即可使用。\n\n'
                  '本次发布 HTML SHA256：`' + digest + '`\n', encoding='utf-8')
              parent = api('/git/ref/heads/' + branch)['object']['sha']
              parent_commit = api('/git/commits/' + parent)
              base_tree = parent_commit['tree']['sha']
              old_entries = api('/git/trees/' + base_tree)['tree']
              assert not any(e['path'] == 'hangzhou-fire-atlas' for e in old_entries), 'Destination already exists; refusing overwrite'
              original_index = next(e for e in old_entries if e['path'] == 'index.html')
              assert original_index['sha'] == '292ef6cbad6922ee1db3a2a2daf39bde988d994e'
              entries = []
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      relative = path.relative_to(root).as_posix()
                      entries.append({'path': prefix + relative, 'mode': '100644', 'type': 'blob', 'content': path.read_text(encoding='utf-8')})
              tree = api('/git/trees', {'base_tree': base_tree, 'tree': entries})
              commit = api('/git/commits', {'message': '发布杭州炭火图鉴：保留原版设计、111条门店及公开出处', 'tree': tree['sha'], 'parents': [parent]})
              api('/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
              print('Imported files:', len(entries))
              print('Feature branch commit:', commit['sha'])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Verified original Hangzhou atlas\n\nHTML SHA256: `' + digest + '`\n\nFeature commit: `' + commit['sha'] + '`\n\nOriginal root website unchanged. Imported files: ' + str(len(entries)) + '\n')
          PY
